<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc">
<title id="title">HTTP request flow</title><desc id="desc">From a readable client socket to a complete response.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1000" height="550" rx="16" fill="#ffffff"/>
<text x="500.0" y="53.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#1e293b">HTTP request flow</text>
<text x="500.0" y="82.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748b">From a readable client socket to a complete response.</text>
<rect x="40" y="140" width="260" height="95" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/>
<text x="170.0" y="183.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">1. Accept and read</text>
<text x="170.0" y="205.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Non-blocking client socket</text>
<rect x="370" y="140" width="260" height="95" rx="12" fill="#e0e7ff" stroke="#1e293b" stroke-width="2"/>
<text x="500.0" y="183.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">2. Parse request</text>
<text x="500.0" y="205.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Method, URL, headers, body</text>
<rect x="700" y="140" width="260" height="95" rx="12" fill="#e0e7ff" stroke="#1e293b" stroke-width="2"/>
<text x="830.0" y="183.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">3. Select route</text>
<text x="830.0" y="205.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Virtual host + location</text>
<rect x="700" y="355" width="260" height="110" rx="12" fill="#fef3c7" stroke="#1e293b" stroke-width="2"/>
<text x="830.0" y="394.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">4. Handle request</text>
<text x="830.0" y="416.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Files / POST / DELETE</text>
<text x="830.0" y="439.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">CGI / redirect / error</text>
<rect x="370" y="355" width="260" height="110" rx="12" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/>
<text x="500.0" y="405.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">5. Send response</text>
<text x="500.0" y="428.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Status, headers, body</text>
<rect x="40" y="355" width="260" height="110" rx="12" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
<text x="170.0" y="405.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">6. Close connection</text>
<text x="170.0" y="428.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Release request state</text>
<polyline points="300,188 360,188" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="630,188 690,188" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="830,235 830,345" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="915.0" y="293.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Apply configuration</text>
<polyline points="700,410 640,410" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="370,410 310,410" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
</svg>

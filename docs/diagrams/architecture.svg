<text x="875.0" y="353.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">HttpRequest</text>
<rect x="790" y="450" width="170" height="90" rx="12" fill="#dcfce7" stroke="#1e293b" stroke-width="2"/>
<text x="875.0" y="490.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Response</text>
<text x="875.0" y="513.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">HttpResponse</text>
<rect x="325" y="450" width="350" height="90" rx="12" fill="#fef3c7" stroke="#1e293b" stroke-width="2"/>
<text x="500.0" y="490.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Files / uploads / CGI</text>
<text x="500.0" y="513.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Child exit + timeout events</text>

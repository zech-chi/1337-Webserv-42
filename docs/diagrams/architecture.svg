<text x="265.0" y="301.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">HTTP</text>
<polyline points="325,365 220,365" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>

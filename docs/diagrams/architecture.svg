<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">Webserv architecture</title><desc id="desc">One event queue coordinates connections, responses, and CGI processes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1000" height="580" rx="16" fill="#ffffff"/>
<text x="500.0" y="53.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#1e293b">Webserv architecture</text>
<text x="500.0" y="82.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748b">One event queue coordinates connections, responses, and CGI processes.</text>
<rect x="340" y="120" width="320" height="75" rx="12" fill="#f1f5f9" stroke="#1e293b" stroke-width="2"/>
<text x="500.0" y="153.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Configuration</text>
<text x="500.0" y="175.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">ParserConfig + Server / Location</text>
<rect x="40" y="290" width="170" height="90" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/>

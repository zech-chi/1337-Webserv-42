<text x="125.0" y="353.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Browser / curl</text>
<rect x="325" y="270" width="350" height="130" rx="12" fill="#dbeafe" stroke="#1e293b" stroke-width="2"/>
<text x="500.0" y="319.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">WebServ</text>
<text x="500.0" y="341.75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">Non-blocking sockets</text>
<text x="500.0" y="364.25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1e293b">kqueue / kevent</text>
<rect x="790" y="290" width="170" height="90" rx="12" fill="#e0e7ff" stroke="#1e293b" stroke-width="2"/>
